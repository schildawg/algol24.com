<script>
  /* ⚠️ The contents are OPEN in the markup and closed by this script on a
     narrow screen, rather than closed and opened by a media query. A closed
     <details> hides its children in a way CSS cannot override -- 'display:
     block' on the list does not bring it back -- so the sidebar could never be
     reached that way round. Inverted, the no-script case shows the whole list
     instead of none of it, which is the better of the two failures. */
  (function () {
    var box = document.querySelector('.toc-wrap');
    var wide = matchMedia('(min-width: 1180px)');

    function fit() { box.open = wide.matches; }

    wide.addEventListener('change', fit);
    fit();
  })();
</script>

name: build and deploy

# The site is built by the Algol-24 compiler, which is itself built from the
# checked-in C in vendor/algol24/bootstrap. So the whole chain from `cc` to a
# published page runs here, and nothing but a C compiler is assumed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build algc
        # Two stages: bootstrap/ builds with cc alone, and that compiler
        # compiles compiler/*.a24 into bootstrap/algc.
        #
        # ⚠️ gnu11, not c11, and this is the step that proved why. The runtime
        # calls readlink("/proc/self/exe") for the program's own path, and
        # glibc's unistd.h declares readlink only when __STRICT_ANSI__ is
        # unset -- which -std=c11 sets. It was a warning on ubuntu-24.04 and
        # became an error when ubuntu-latest moved to 26.04 on 2026-10-28,
        # failing a seed that had built four days earlier. macOS declares it
        # either way, so nothing local sees this. The compiler's own
        # bootstrap/build.sh defaults to c11, hence the env rather than a flag.
        env:
          CFLAGS: -std=gnu11 -O2
        run: |
          cd vendor/algol24
          ./bootstrap/build.sh
          ./bootstrap/algc --version

      - name: Test the generator
        # The generator has its own test blocks. A site that fails its tests
        # should not reach the artifact.
        run: vendor/algol24/bootstrap/algc --test gen/Main.a24

      - name: Generate the site
        # The site root only: the generator makes site/reference itself, now
        # that the language has MkDir.
        #
        # The generator is compiled and then run, which is what build.sh does.
        # Emitted fresh each time because the directory is built with 'cc *.c'.
        run: |
          mkdir -p site build
          vendor/algol24/bootstrap/algc --compile --out=build gen/Main.a24
          cc -std=gnu11 -O2 -o build/generate build/*.c
          ./build/generate

      - name: Agree with the other two processors
        # ⚠️ THE POINT OF THIS STEP IS THAT IT CAN FAIL. The language has three
        # processors and all three must agree on every program; this generator
        # is 2,250 lines reading 27,000 lines of Markdown, which exercises one
        # far harder than any single conformance case. If the machine and the
        # compiled back end disagree about one byte of the published site, one
        # of them is wrong and this job should go red rather than deploy.
        #
        # ⚠️ gnu11 again, for the same readlink reason as the algc step above:
        # vm/build.sh also defaults to -std=c11. And libffi is NOT optional
        # here -- there is no --ffi switch, because a foreign call is a feature
        # of the language, so the machine refuses to build without one.
        env:
          CFLAGS: -std=gnu11 -O2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libffi-dev
          ( cd vendor/algol24 && ./vm/build.sh )
          vendor/algol24/vm/algvm --version

          # The suite, on the machine. 124 of them, and the library's own
          # string tests are among them now: --test is transitive over 'uses'.
          vendor/algol24/vm/algvm --test gen/Main.a24

          # ⚠️ The generator writes to site/ and nowhere else, so the compiled
          # run has to be moved aside rather than pointed somewhere. Put it
          # back afterwards: the artifact uploaded below is the COMPILED site,
          # which is what every other step has already checked.
          mv site site-cc
          mkdir -p site
          vendor/algol24/vm/algvm gen/Main.a24

          if ! diff -r site-cc site; then
            echo "::error::the bytecode machine and the C back end disagree about the site"
            exit 1
          fi

          rm -rf site
          mv site-cc site

      - name: Add static assets
        run: |
          cp -R static/. site/ 2>/dev/null || true
          cp brand/dist/favicon.ico \
             brand/dist/favicon-16.png \
             brand/dist/favicon-32.png \
             brand/dist/apple-touch-icon.png \
             brand/dist/icon-192.png \
             brand/dist/icon-512.png \
             brand/dist/og-image.png \
             site/

      - name: Check nothing was left unrendered
        # A '{{' surviving into the output means a placeholder the generator
        # does not know about. Cheap to check, and invisible otherwise.
        # -I skips binaries: a PNG will contain the bytes '{{' sooner or later,
        # and og-image.png duly did.
        run: |
          if grep -rnI '{{' site/ ; then
            echo "::error::unrendered placeholder in the generated site"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

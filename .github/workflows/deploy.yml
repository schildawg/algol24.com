name: build and deploy

# The site is built by the Algol-24 compiler, which is itself built from the
# checked-in C in vendor/algol24/bootstrap. So the whole chain from `cc` to a
# published page runs here, and nothing but a C compiler is assumed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build algc
        # Two stages: bootstrap/ builds with cc alone, and that compiler
        # compiles compiler/*.a24 into bootstrap/algc.
        #
        # ⚠️ gnu11, not c11, and this is the step that proved why. The runtime
        # calls readlink("/proc/self/exe") for the program's own path, and
        # glibc's unistd.h declares readlink only when __STRICT_ANSI__ is
        # unset -- which -std=c11 sets. It was a warning on ubuntu-24.04 and
        # became an error when ubuntu-latest moved to 26.04 on 2026-10-28,
        # failing a seed that had built four days earlier. macOS declares it
        # either way, so nothing local sees this. The compiler's own
        # bootstrap/build.sh defaults to c11, hence the env rather than a flag.
        env:
          CFLAGS: -std=gnu11 -O2
        run: |
          cd vendor/algol24
          ./bootstrap/build.sh
          ./bootstrap/algc --version

      - name: Test the generator
        # The generator has its own test blocks. A site that fails its tests
        # should not reach the artifact.
        run: vendor/algol24/bootstrap/algc --test gen/Main.a24

      - name: Generate the site
        # The site root only: the generator makes site/reference itself, now
        # that the language has MkDir.
        #
        # The generator is compiled and then run, which is what build.sh does.
        # Emitted fresh each time because the directory is built with 'cc *.c'.
        run: |
          mkdir -p site build
          vendor/algol24/bootstrap/algc --compile --out=build gen/Main.a24
          cc -std=gnu11 -O2 -o build/generate build/*.c
          ./build/generate

      - name: Agree with the other two processors
        # ⚠️ THE POINT OF THIS STEP IS THAT IT CAN FAIL. The language has three
        # processors and all three must agree on every program; this generator
        # is 2,374 lines reading 30,000 lines of Markdown, which exercises one
        # far harder than any single conformance case. If either of the other
        # two disagrees with the compiled back end about one byte of the
        # published site, one of them is wrong and this job should go red
        # rather than deploy.
        #
        # ⚠️ IT CHECKED ONLY THE MACHINE UNTIL v0.2.7, so its own name was a
        # promise it did not keep. D-3 was a wrong answer in the TREE-WALKER --
        # one line of 27,875 two characters short -- and it reached a release
        # because nothing here ran that processor. It took a hand-run to find.
        # The interpreter is the slowest of the three and the comparison is the
        # cheapest insurance available against shipping a wrong answer.
        #
        # ⚠️ ALG_TEXT_CHECK=1 is on for both runs, at about 18% on the
        # interpreter. It recomputes every cached text length where the cache
        # answers it and fails naming both answers, which is what D-3 looked
        # like underneath: a character count keyed on where a string's bytes
        # were, answered for a later string at the same address. A byte diff
        # says only that two processors disagree; this says why.
        #
        # ⚠️ gnu11 again, for the same readlink reason as the algc step above:
        # vm/build.sh also defaults to -std=c11. And libffi is NOT optional
        # here -- there is no --ffi switch, because a foreign call is a feature
        # of the language, so the machine refuses to build without one.
        env:
          CFLAGS: -std=gnu11 -O2
          ALG_TEXT_CHECK: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libffi-dev
          ( cd vendor/algol24 && ./vm/build.sh )
          vendor/algol24/vm/algvm --version

          # The suite, on the machine. 124 of them, and the library's own
          # string tests are among them now: --test is transitive over 'uses'.
          vendor/algol24/vm/algvm --test gen/Main.a24

          # ⚠️ The generator writes to site/ and nowhere else, so the compiled
          # run has to be moved aside rather than pointed somewhere. It is put
          # back at the end: the artifact uploaded below is the COMPILED site,
          # which is what every other step has already checked.
          mv site site-cc

          # The bytecode machine.
          mkdir -p site
          vendor/algol24/vm/algvm gen/Main.a24

          if ! diff -r site-cc site; then
            echo "::error::the bytecode machine and the C back end disagree about the site"
            exit 1
          fi

          # And the tree-walking interpreter, which is where D-3 lived.
          rm -rf site
          mkdir -p site
          vendor/algol24/bootstrap/algc gen/Main.a24

          if ! diff -r site-cc site; then
            echo "::error::the tree-walking interpreter and the C back end disagree about the site"
            exit 1
          fi

          rm -rf site
          mv site-cc site

      - name: Run the site from a bytecode image
        # ⚠️ A FOURTH PATH RATHER THAN A FOURTH PROCESSOR, which is why this is
        # its own step. v0.5.0 lets the machine write its bytecode to a file and
        # load it back instead of compiling -- so there are now two ways to
        # reach the machine, and only one of them was checked above. The step
        # before this one is named for the other two PROCESSORS and keeps that
        # name: its own name was a promise it did not keep once already, when it
        # checked the machine alone and D-3 walked through the gap.
        #
        # ⚠️ WHAT THIS GUARDS IS STALENESS, and the format cannot guard it
        # itself. An image carries the release that wrote it, so another BUILD
        # is refused by name -- but nothing checks that an image is newer than
        # the source it came from, the language having no way to ask a file its
        # age. Seen to fail: emitting an image, then changing a page constant
        # and rebuilding, makes this diff report the status line and exit 1.
        # That is the whole failure mode, and it is the one a build step can
        # actually catch.
        #
        # Nothing published comes from an image. The artifact is still the
        # COMPILED site, which every other step has already checked; this only
        # asks whether the machine answers the same from a file as from source.
        # It costs about four seconds, algvm having been built above.
        env:
          ALG_TEXT_CHECK: '1'
        run: |
          vendor/algol24/vm/algvm --emit gen/Main.a24 --out=gen.a24b

          # Same move-aside as the step above, and for the same reason: the
          # generator writes to site/ and nowhere else.
          mv site site-cc
          mkdir -p site
          vendor/algol24/vm/algvm gen.a24b

          if ! diff -r site-cc site; then
            echo "::error::the machine disagrees with itself about the site when it loads bytecode from a file rather than compiling it"
            exit 1
          fi

          # ⚠️ A TEST RUN IS A SECOND IMAGE and cannot be the same one: --test
          # changes what gets COMPILED, leaving a unit's bare statements out and
          # putting its test bodies in. Worth checking because upstream found
          # that nothing was running `algvm --test` at all -- a crash in the
          # machine's own emitter sat for three releases -- and this is the
          # cheaper way to run it.
          vendor/algol24/vm/algvm --emit --test gen/Main.a24 --out=gen-test.a24b
          vendor/algol24/vm/algvm --test gen-test.a24b

          rm -rf site gen.a24b gen-test.a24b
          mv site-cc site

      - name: Add static assets
        run: |
          cp -R static/. site/ 2>/dev/null || true
          cp brand/dist/favicon.ico \
             brand/dist/favicon-16.png \
             brand/dist/favicon-32.png \
             brand/dist/apple-touch-icon.png \
             brand/dist/icon-192.png \
             brand/dist/icon-512.png \
             brand/dist/og-image.png \
             site/

      - name: Check nothing was left unrendered
        # A '{{' surviving into the output means a placeholder the generator
        # does not know about. Cheap to check, and invisible otherwise.
        # -I skips binaries: a PNG will contain the bytes '{{' sooner or later,
        # and og-image.png duly did.
        run: |
          if grep -rnI '{{' site/ ; then
            echo "::error::unrendered placeholder in the generated site"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

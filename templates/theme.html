<script>
  (function () {
    var btn  = document.getElementById('toggle');
    var root = document.documentElement;

    function current() {
      var set = root.getAttribute('data-theme');
      if (set) return set;
      return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function paint() {
      /* The lit star is whichever one leads the active theme. */
      var dark = current() === 'dark';
      root.querySelector('.star-a-icon').setAttribute('class', 'star-a-icon ' + (dark ? 'dim' : 'lit'));
      root.querySelector('.star-b-icon').setAttribute('class', 'star-b-icon ' + (dark ? 'lit' : 'dim'));
      btn.setAttribute('title', dark ? 'Switch to light' : 'Switch to dark');
      btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    }

    btn.addEventListener('click', function () {
      var next = current() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('algol-theme', next); } catch (e) {}
      paint();
    });

    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (!root.getAttribute('data-theme')) paint();
    });

    paint();
  })();
</script>
